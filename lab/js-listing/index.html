<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>JS listing test</title></head>
<body>
<h1>Client-rendered listing (test page)</h1>
<p><a href="/lab/js-listing/static-post">A link in the HTML</a></p>
<ul id="inline"></ul>
<ul id="fetched"></ul>
<script>
  // links built by script on load, like a client-rendered blog index
  for (const s of ["inline-post-1", "inline-post-2", "inline-post-3"]) {
    const li = document.createElement("li"), a = document.createElement("a");
    a.href = "/lab/js-listing/" + s; a.textContent = s; li.append(a); document.getElementById("inline").append(li);
  }
  // links loaded from a JSON API after the page loads
  fetch("/lab/js-listing/posts.json").then(r => r.json()).then(posts => {
    for (const s of posts) {
      const li = document.createElement("li"), a = document.createElement("a");
      a.href = "/lab/js-listing/" + s; a.textContent = s; li.append(a); document.getElementById("fetched").append(li);
    }
  });
</script>
</body></html>
